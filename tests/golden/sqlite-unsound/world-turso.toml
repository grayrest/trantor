# roc:sqlite-unsound — its own world (P3), rusqlite backend (SQ1). SQ2 adds a
# turso wiring. rusqlite-host is the sole vendor of libsqlite3 (H0c).
[world]
name = "sqlite-unsound-turso"
driver = "drv"
exports = ["Sql", "Report", "Turso"]

[interfaces.io]
[interfaces.sqlite]
[interfaces.turso]
[interfaces.report]

[components.drv]
kind = "driver"
lang = "rust"
provides_runtime = true

[components.turso-host]
kind = "host"
lang = "rust"
exports = ["sqlite", "turso"]
# turso pulls CoreFoundation (via chrono/iana_time_zone, deep in turso_core);
# roc links a framework only from a bundled sysroot, which `trantor build`
# generates from this declaration (R-SQ2).
frameworks = ["CoreFoundation"]
[components.report-host]
kind = "host"
lang = "rust"
exports = ["report"]
test_only = true

[wiring]
sqlite = "turso-host"
turso = "turso-host"
report = "report-host"
