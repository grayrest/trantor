# roc:sqlite-unsound — its own world (P3), rusqlite backend (SQ1). SQ2 adds a
# turso wiring. rusqlite-host is the sole vendor of libsqlite3 (H0c).
[world]
name = "sqlite-unsound"
driver = "drv"
exports = ["Sql", "Report"]

[interfaces.io]
[interfaces.sqlite]
[interfaces.report]

[components.drv]
kind = "driver"
lang = "rust"
provides_runtime = true

[components.rusqlite-host]
kind = "host"
lang = "rust"
exports = ["sqlite"]
[components.report-host]
kind = "host"
lang = "rust"
exports = ["report"]
test_only = true

[wiring]
sqlite = "rusqlite-host"
report = "report-host"
