[world]
name = "seahaven-stdio-std"
driver = "cli"
exports = ["Stdout", "Stderr"]

[interfaces.io]
[interfaces.stdio]

[components.std-stdio]
kind = "host"
lang = "rust"
exports = ["stdio"]
[components.stdio-lib]
kind = "roc"
imports = ["stdio"]
exports = ["Stdout", "Stderr"]
[components.cli]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Stdout", "Stderr"]

[wiring]
stdio = "std-stdio"
