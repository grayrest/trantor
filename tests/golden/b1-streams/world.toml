[world]
name = "b1-streams"
driver = "cli"
exports = ["Streams", "Memory", "FileIo"]
[interfaces.io]
[interfaces.sync-io]
[interfaces.memory]
[interfaces.file]
[components.sync-io]
kind = "host"
lang = "rust"
exports = ["sync-io"]
[components.memory]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["memory"]
[components.file]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["file"]
[components.cli]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Streams", "Memory", "FileIo"]
[wiring]
sync-io = "sync-io"
memory = "memory"
file = "file"
