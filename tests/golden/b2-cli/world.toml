[world]
name = "b2-cli-main"
driver = "main-driver"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[components.main-driver]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Stdout", "Stderr", "Stdin", "Env"]

[interfaces.io]
source = "roc:io/error@0.1.0"
[interfaces.sync-io]
source = "roc:sync-io/streams@0.1.0"
[interfaces.cli-stdout]
source = "roc:cli/stdout@0.1.0"
[interfaces.cli-stdin]
source = "roc:cli/stdin@0.1.0"
[interfaces.cli-env]
source = "roc:cli/environment@0.1.0"
[interfaces.cli-tty]
source = "roc:cli/terminal@0.1.0"
[components.sync-io]
kind = "host"
lang = "rust"
exports = ["sync-io"]
[components.cli-host]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty"]
[components.host-shim]
kind = "roc"
imports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty", "sync-io"]
exports = ["Host"]
[components.stdio-lib]
kind = "roc"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[wiring]
sync-io = "sync-io"
cli-stdout = "cli-host"
cli-stdin = "cli-host"
cli-env = "cli-host"
cli-tty = "cli-host"
