[world]
name = "b2-cli-run"
driver = "run-driver"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[components.run-driver]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Stdout", "Stderr", "Stdin", "Env"]

[interfaces.io]
[interfaces.sync-io]
[interfaces.cli-stdout]
[interfaces.cli-stdin]
[interfaces.cli-env]
[interfaces.cli-tty]
[components.sync-io]
kind = "host"
lang = "rust"
exports = ["sync-io"]
[components.cli-host]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty"]
[components.host-shim]
kind = "roc"
imports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty", "sync-io"]
exports = ["Host"]
[components.stdio-lib]
kind = "roc"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[wiring]
sync-io = "sync-io"
cli-stdout = "cli-host"
cli-stdin = "cli-host"
cli-env = "cli-host"
cli-tty = "cli-host"
