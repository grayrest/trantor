# H7 service-component fixture (plan 2026-09-09): imview-slice + a sync service
# (echo) and an async one with an env block (tick). P0 hand-wired it; P1 wires
# it through the generated abi/src/services.rs shim and the splice markers.
[world]
name = "imsvc"
driver = "imview"
exports = ["Element", "Env", "Cmd", "Event", "Echo", "EchoEvent", "Tick", "TickEvent", "TickEnv", "Bell", "BellEvent", "Nudge", "NudgeEvent", "Chime", "ChimeEvent"]

[interfaces.ui]
[interfaces.echo]
[interfaces.tick]
[interfaces.bell]
[interfaces.nudge]
[interfaces.chime]

[components.imview]
kind = "driver"
lang = "rust"
provides_runtime = true
# The driver ships its contract modules; Cmd/Event/Env carry splice markers.
exports = ["Cmd", "Event", "Env"]
requires_uses = ["Env", "Element", "Cmd", "Event"]

[components.svc-echo]
kind = "host"
lang = "rust"
exports = ["echo"]

[components.svc-tick]
kind = "host"
lang = "rust"
exports = ["tick"]

[components.svc-bell]
kind = "host"
lang = "rust"
exports = ["bell"]

[components.svc-nudge]
kind = "host"
lang = "rust"
exports = ["nudge"]

[components.svc-chime]
kind = "host"
lang = "rust"
exports = ["chime"]

[wiring]
echo = "svc-echo"
tick = "svc-tick"
bell = "svc-bell"
nudge = "svc-nudge"
chime = "svc-chime"
