# B7 consumes two packages — trantor-cli for the platform, trantor-temporal on
# top — and carries no component of its own.
#
# It used to vendor a copy of trantor-cli's components with a hand-wired
# driver, and its header claimed that made it "a different world, with a
# different driver and no basic-cli shim". Neither held. The driver differed
# only in carrying trantor-cli's OLD `main!` contract, and it exported
# Stdout/Env/Path/Utc/Locale/Url from vendored shim components. It was a stale
# snapshot, and like every copy in this tree it drifted.
#
# What B7 proves that trantor-temporal's own gate does not: temporal_rs lives in
# exactly one archive (H0c), a world WITHOUT the package links none of it, and
# the resources the package hands out are all dropped. The package's gate has a
# module-level negative control but no archive check, no link-level one, and no
# drop gauge.
[world]
name = "b7-temporal"

[deps]
trantor-cli      = { path = "../../../../trantor-cli" }
trantor-temporal = { path = "../../../../trantor-temporal" }
