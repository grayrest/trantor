[world]
name = "b7-temporal"
driver = "main-driver"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env", "Path", "Utc", "Sleep", "Random", "Locale", "Url", "Temporal"]
[components.main-driver]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Stdout", "Stderr", "Stdin", "Env"]
[interfaces.io]
[interfaces.sync-io]
[interfaces.cli-stdout]
[interfaces.cli-stdin]
[interfaces.cli-env]
[interfaces.cli-tty]
[interfaces.fs]
[interfaces.cell]
[interfaces.clocks]
[interfaces.random]
[interfaces.locale]
[interfaces.temporal]
[components.sync-io]
kind = "host"
lang = "rust"
exports = ["sync-io"]
[components.cli-host]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty"]
[components.cell]
kind = "host"
lang = "rust"
exports = ["cell"]
[components.fs-unconfined]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["fs"]
[components.clocks-host]
kind = "host"
lang = "rust"
exports = ["clocks"]
[components.random-host]
kind = "host"
lang = "rust"
exports = ["random"]
[components.locale-host]
kind = "host"
lang = "rust"
exports = ["locale"]
[components.temporal-host]
kind = "host"
lang = "rust"
exports = ["temporal"]
[components.host-shim]
kind = "roc"
exports = ["Host"]
[components.basic-lib]
kind = "roc"
exports = ["Utc", "Sleep", "Random", "Locale", "Url", "InternalDateTime"]
[components.fs-ops]
kind = "roc"
imports = ["fs", "cell"]
exports = ["FsOps"]
[components.path]
kind = "roc"
exports = ["Path"]
[components.stdio-lib]
kind = "roc"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[wiring]
sync-io = "sync-io"
cli-stdout = "cli-host"
cli-stdin = "cli-host"
cli-env = "cli-host"
cli-tty = "cli-host"
cell = "cell"
fs = "fs-unconfined"
clocks = "clocks-host"
random = "random-host"
locale = "locale-host"
temporal = "temporal-host"
