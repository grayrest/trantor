# A HOST workspace that owns the component crates (roc-solid's shape): the
# world under world/ builds them here through `[world] cargo_root` (D-H7-14).
[workspace]
resolver = "2"
members = ["crates/drv", "crates/svc"]

# The default abi for this workspace's own `cargo clippy/test`: the baseline
# world's generated crate. trantor overrides it per build with `--config`.
[patch.crates-io]
trantor-abi = { path = "target/trantor/world/abi" }
