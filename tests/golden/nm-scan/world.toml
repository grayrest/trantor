# nm-scan REJECT case: two host components that both define the same unmangled
# global (`trantor_probe_collision`). `trantor scan` must reject this — the
# roc link would otherwise resolve it silently by archive order (H0c). This
# world exists only to exercise the scanner; it is not composed or run.
[world]
name = "nm-scan-collide"
driver = "probe-a"   # unused by `scan`; load_world requires the field

[components.probe-a]
kind = "host"
lang = "rust"
[components.probe-b]
kind = "host"
lang = "rust"

[wiring]
