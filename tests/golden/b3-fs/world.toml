[world]
name = "b3-unconfined"
driver = "main-driver"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env", "Path"]
[components.main-driver]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Stdout", "Stderr", "Stdin", "Env"]
[interfaces.io]
[interfaces.sync-io]
[interfaces.cli-stdout]
[interfaces.cli-stdin]
[interfaces.cli-env]
[interfaces.cli-tty]
[interfaces.fs]
[interfaces.cell]
[components.sync-io]
kind = "host"
lang = "rust"
exports = ["sync-io"]
[components.cli-host]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty"]
[components.cell]
kind = "host"
lang = "rust"
exports = ["cell"]
[components.fs-unconfined]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["fs"]
[components.host-shim]
kind = "roc"
exports = ["Host"]
[components.fs-ops]
kind = "roc"
imports = ["fs", "cell"]
exports = ["FsOps"]
[components.path]
kind = "roc"
exports = ["Path"]
[components.stdio-lib]
kind = "roc"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[wiring]
sync-io = "sync-io"
cli-stdout = "cli-host"
cli-stdin = "cli-host"
cli-env = "cli-host"
cli-tty = "cli-host"
cell = "cell"
fs = "fs-unconfined"
