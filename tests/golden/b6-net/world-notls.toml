[world]
name = "b6-net-notls"
driver = "main-driver"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env", "Path", "Utc", "Sleep", "Random", "Locale", "Url", "Cmd", "OsStr", "Tcp", "Http", "Udp", "Sockets", "Streams", "TempTest"]
[components.main-driver]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Stdout", "Stderr", "Stdin", "Env"]
[interfaces.io]
[interfaces.sync-io]
[interfaces.cli-stdout]
[interfaces.cli-stdin]
[interfaces.cli-env]
[interfaces.cli-tty]
[interfaces.fs]
[interfaces.cell]
[interfaces.clocks]
[interfaces.random]
[interfaces.locale]
[interfaces.subprocess]
[interfaces.sync-sockets]
[interfaces.sync-http]
[interfaces.testnet]
[components.sync-io]
kind = "host"
lang = "rust"
exports = ["sync-io"]
[components.cli-host]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["cli-stdout", "cli-stdin", "cli-env", "cli-tty"]
[components.cell]
kind = "host"
lang = "rust"
exports = ["cell"]
[components.fs-unconfined]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["fs"]
[components.clocks-host]
kind = "host"
lang = "rust"
exports = ["clocks"]
[components.random-host]
kind = "host"
lang = "rust"
exports = ["random"]
[components.locale-host]
kind = "host"
lang = "rust"
exports = ["locale"]
[components.subprocess-host]
kind = "host"
lang = "rust"
exports = ["subprocess"]
[components.cmd-lib]
kind = "roc"
exports = ["Cmd", "OsStr", "Tcp", "Http", "Udp", "Sockets", "Streams", "TestNet"]
[components.sockets-host]
kind = "host"
lang = "rust"
imports = ["sync-io"]
exports = ["sync-sockets"]
[components.http-host]
kind = "host"
lang = "rust"
exports = ["sync-http"]
default_features = false        # HC4 negative case: compose http-host with tls OFF
[components.testnet-host]
kind = "host"
lang = "rust"
exports = ["testnet"]
[components.net-lib]
kind = "roc"
exports = ["Tcp", "Http", "InternalHttp", "Udp"]
[components.host-shim]
kind = "roc"
exports = ["Host"]
[components.temptest]
kind = "roc"
exports = ["TempTest"]
[components.basic-lib]
kind = "roc"
exports = ["Utc", "Sleep", "Random", "Locale", "Url", "InternalDateTime"]
[components.fs-ops]
kind = "roc"
imports = ["fs", "cell"]
exports = ["FsOps"]
[components.path]
kind = "roc"
exports = ["Path"]
[components.stdio-lib]
kind = "roc"
exports = ["Stdout", "Stderr", "Stdin", "Tty", "Env"]
[wiring]
sync-io = "sync-io"
cli-stdout = "cli-host"
cli-stdin = "cli-host"
cli-env = "cli-host"
cli-tty = "cli-host"
cell = "cell"
fs = "fs-unconfined"
clocks = "clocks-host"
random = "random-host"
locale = "locale-host"
subprocess = "subprocess-host"
sync-sockets = "sockets-host"
sync-http = "http-host"
testnet = "testnet-host"

[packages]
http = "https://github.com/roc-lang/http/releases/download/1.0.0/6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst"
