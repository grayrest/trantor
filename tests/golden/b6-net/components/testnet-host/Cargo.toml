[package]
name = "testnet-host"
version = "0.0.0"
edition = "2021"
publish = false
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
trantor-abi = { path = "../../abi" }
sync-io-core = { path = "../sync-io-core" }
# HC4: a rustls TLS server presenting the ephemeral test cert, so an https://
# GET exercises a real handshake + cert validation + body-over-TLS, offline.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# HC5: serve gzip/brotli-encoded bodies so the client's transparent decode
# (ureq gzip+brotli) can be proven — the stream must yield the DECODED bytes.
flate2 = "1"
brotli = "7"
