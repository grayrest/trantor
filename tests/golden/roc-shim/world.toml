# roc-shim world: the filesystem interface is fulfilled by a pure-Roc shim
# (memfs) instead of a host component. Path.roc is byte-identical to the
# two-component fixture -- the whole point (D2/D19).

[world]
name = "reader-memfs"
driver = "cli"
exports = ["Path", "Stdio", "Env"]

[interfaces.io]
[interfaces.filesystem]
[interfaces.stdio]
[interfaces.env]
[interfaces.cell]

[components.stdio]
kind = "host"
lang = "rust"
exports = ["stdio"]
[components.env]
kind = "host"
lang = "rust"
exports = ["env"]
[components.cell]
kind = "host"
lang = "rust"
exports = ["cell"]
[components.memfs]
kind = "roc"                 # the Roc shim -- no host archive
imports = ["cell"]
exports = ["filesystem"]
[components.pathlib]
kind = "roc"
imports = ["filesystem"]
exports = ["Path"]
[components.cli]
kind = "driver"
lang = "rust"
provides_runtime = true
requires_uses = ["Path", "Stdio", "Env"]

[wiring]
stdio = "stdio"
filesystem = "memfs"          # Roc shim, not audit(capstdfs)
env = "env"
cell = "cell"
