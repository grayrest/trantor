# roc:basic-cli, composed from the trantor-cli PACKAGE.
#
# This world used to carry its own copy of every interface and component. It
# does not any more: trantor-cli is the definitive source and this is a
# consumer of it, which is also what makes this fixture a real test of package
# consumption at scale — ~150 upstream basic-cli examples building against a
# platform that arrives through one [deps] line.
#
# The path is a sibling checkout. verify.sh says so plainly when it is missing,
# because "no such file" on a generated path is not a diagnosis.

[world]
name = "basic-cli"

[deps]
trantor-cli = { path = "../../../../trantor-cli" }
# The http examples need sockets and the test server, which left the baseline.
trantor-net = { path = "../../../../trantor-net" }
trantor-process = { path = "../../../../trantor-process" }
# `Tty` — raw mode left the baseline for its own package (K1).
trantor-terminal = { path = "../../../../trantor-terminal" }
