# HC0 golden fixture: the composer's per-component Cargo-features knob (H12).
# `marker` is a host component with a Cargo feature `extra` that gates one
# symbol. This world composes it with `extra` on (features = ["extra"]);
# world-noextra.toml composes the SAME component with the feature off. The
# generated components/marker/Cargo.toml `[features] default` reflects each,
# and `nm` on the archive shows the gated symbol present/absent.

[world]
name = "hc0-features"
driver = "drv"
exports = ["Mark"]

[interfaces.io]
[interfaces.mark]

[components.drv]
kind = "driver"
lang = "rust"
provides_runtime = true

[components.marker]
kind = "host"
lang = "rust"
exports = ["mark"]
features = ["extra"]        # <-- the knob: compose `marker` with `extra` on

[wiring]
mark = "marker"
