[package]
name = "trantor"
version = "0.1.0"
edition = "2021"
description = "A build-time component composition system for Roc platforms."

[[bin]]
name = "trantor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Already in the tree beneath `toml`; named directly so world.toml can be
# edited without reformatting a file the user hand-writes.
toml_edit = "0.22"

# This tool is its own workspace; the fixtures under tests/ have their own.
[workspace]
exclude = ["tests", "spikes"]
